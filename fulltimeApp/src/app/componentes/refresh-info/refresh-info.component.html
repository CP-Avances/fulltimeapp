<ion-refresher
  slot="fixed"
  class="refresh-info"
  (ionRefresh)="doRefresh($event)">

  <ion-refresher-content
    pullingIcon="refresh-outline"
    pullingText="Deslice hacia abajo para actualizar"
    refreshingSpinner="circles"
    refreshingText="Actualizando información...">
  </ion-refresher-content>

</ion-refresher>

<div class="refresh-info-text">
  <ion-icon name="refresh-outline"></ion-icon>
  <ion-text>
    Deslice hacia abajo para actualizar
  </ion-text>
</div>
