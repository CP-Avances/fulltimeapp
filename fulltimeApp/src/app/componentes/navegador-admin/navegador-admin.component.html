<ion-header id="main-admin" class="app-header">
    <ion-toolbar>

        <ion-buttons slot="start" class="header-left">
            <ion-button (click)="openAdmin()" class="btn-header">
                <ion-icon name="menu-outline"></ion-icon>
            </ion-button>

            <div class="avatar-header">
                <img [src]="imagen" alt="Perfil" (error)="onImageError($event)" />
            </div>
        </ion-buttons>

        <div class="nombreusua">
            <h6>{{ username }}</h6>
            <h6>{{ codigo }}</h6>
        </div>

        <ion-buttons slot="end" class="header-right">
            <ion-button (click)="Mostrarpopnotificaciones($event)" id="notification-button" class="btn-notification"
                [disabled]="isConnected == false">

                <ion-icon name="notifications-outline"></ion-icon>

                <ion-badge *ngIf="(countNoti != 0) && (countNoti != null)" id="notifications-badge" mode="md">
                    {{ countNoti }}
                </ion-badge>

            </ion-button>
        </ion-buttons>

    </ion-toolbar>
</ion-header>

<ion-menu side="start" menuId="admin" contentId="main-admin" class="menu-admin">

    <ion-header class="menu-header">
        <ion-toolbar>
            <ion-buttons slot="start">
                <ion-button (click)="closeAdmin()" class="btn-back-menu">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </ion-button>
            </ion-buttons>

            <ion-title>Menú</ion-title>
        </ion-toolbar>

        <div class="menu-profile">
            <div class="menu-avatar">
                <img [src]="imagen" alt="Perfil" (error)="onImageError($event)" />
            </div>

            <div class="menu-user-info">
                <h3>{{ username }}</h3>
                <p>{{ codigo }}</p>
                <p>Reloj Virtual</p>
            </div>
        </div>
    </ion-header>

    <ion-content class="menu-content">

        <ion-list mode="md" class="menu-list">

            <ion-item [routerLink]="['/reloj/horarios-empleados']" (click)="closeAdmin()" *ngIf="permisosRol.horarios"
                class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="calendar-outline"></ion-icon>
                </div>
                <ion-label>Horarios</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/reloj/solicitudes']" (click)="closeAdmin()" class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="folder-open-outline"></ion-icon>
                </div>
                <ion-label>Solicitudes</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/reloj/aprobaciones']" (click)="closeAdmin()" *ngIf="permisosRol.aprobaciones"
                class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="checkmark-done-outline"></ion-icon>
                </div>
                <ion-label>Aprobaciones</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/reloj/justificar-timbres']" (click)="closeAdmin()"
                *ngIf="permisosRol.justificarTimbres" class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="hourglass-outline"></ion-icon>
                </div>
                <ion-label>Registrar Timbres</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/reloj/timbres-empleados']" (click)="closeAdmin()"
                *ngIf="permisosRol.timbresEmpleados" class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="people-outline"></ion-icon>
                </div>
                <ion-label>Timbres</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/actualizar-timbres']" (click)="closeAdmin()" class="menu-item"
                *ngIf="permisosRol.actualizarTimbres">
                <div class="menu-icon" slot="start">
                    <ion-icon name="people-outline"></ion-icon>
                </div>
                <ion-label>Actualizar Timbres</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/reloj/comunicado']" (click)="closeAdmin()" *ngIf="permisosRol.comunicados"
                class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="megaphone-outline"></ion-icon>
                </div>
                <ion-label>Comunicados</ion-label>
            </ion-item>

            <ion-item [routerLink]="['/reloj/reportes']" (click)="closeAdmin()" *ngIf="permisosRol.reporteTimbres"
                class="menu-item">
                <div class="menu-icon" slot="start">
                    <ion-icon name="documents-outline"></ion-icon>
                </div>
                <ion-label>Reportes</ion-label>
            </ion-item>

            <ion-item (click)="presentModalTimbresPerdidos()" class="menu-item">
                <div class="menu-icon warning" slot="start">
                    <ion-icon name="alarm-outline"></ion-icon>
                </div>
                <ion-label>Timbres No Enviados</ion-label>
            </ion-item>

        </ion-list>

    </ion-content>

    <ion-footer class="menu-footer">
        <ion-item (click)="cerrarSesion()" lines="none" class="logout-item">
            <div class="menu-icon logout" slot="start">
                <ion-icon name="log-out-outline"></ion-icon>
            </div>
            <ion-label>Cerrar Sesión</ion-label>
        </ion-item>
    </ion-footer>

</ion-menu>
