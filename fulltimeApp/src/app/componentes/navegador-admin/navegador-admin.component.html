<ion-header id="main-admin">
    <ion-toolbar>
        <!-- Mover el botón de notificaciones al inicio del header -->
        <ion-buttons slot="start">
            <ion-button (click)="openAdmin()" style="margin-right: -5px;">
                <ion-icon name="menu-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-buttons slot="start">
            <img [src]="imagen" alt="Perfil"
                style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-left: 15%"
                (error)="onImageError($event)">
        </ion-buttons>

        <div class="nombreusua" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);">
            <h6><b>{{username}}</b></h6>
        </div>

        <ion-buttons slot="end">
            <ion-button slot="end" (click)="Mostrarpopnotificaciones($event)" id="notification-button"
                style="width: 40px;" [disabled]="isConnected == false">
                <ion-icon name="notifications-outline"></ion-icon>
            </ion-button>
            <ion-badge *ngIf="(countNoti != 0) && (countNoti != null)" id="notifications-badge" mode="md">
                {{countNoti}}
            </ion-badge>
        </ion-buttons>

    </ion-toolbar>
</ion-header>

<ion-menu side="start" menuId="admin" contentId="main-admin">
    <ion-header>
        <ion-toolbar translucent>
            <ion-buttons slot="start">
                <ion-button (click)="closeAdmin()">
                    <ion-icon name="arrow-back-outline"></ion-icon>
                </ion-button>
            </ion-buttons>
            <ion-title>Menú</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content>
        <ion-list mode="md" style="height: 100%;">
            <ion-item [routerLink]="['/reloj/solicitudes']" (click)="closeAdmin()">
                <ion-icon name="folder-open-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Solicitudes</ion-label>
            </ion-item>
            <ion-item [routerLink]="['/reloj/comunicado']" (click)="closeAdmin()">
                <ion-icon name="megaphone-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Comunicados</ion-label>
            </ion-item>
            <ion-item [routerLink]="['/reloj/timbres-empleados']" (click)="closeAdmin()">
                <ion-icon name="people-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Timbres Empleados</ion-label>
            </ion-item>
            <ion-item [routerLink]="['/reloj/horarios-empleados']" (click)="closeAdmin()">
                <ion-icon name="calendar-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Horarios Empleados</ion-label>
            </ion-item>
            <ion-item [routerLink]="['/reloj/justificar-timbres']" (click)="closeAdmin()">
                <ion-icon name="hourglass-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Registrar Timbres</ion-label>
            </ion-item>

            <!--
            <ion-item [routerLink]="['/reloj/aprobaciones']" (click)="closeAdmin()">
                <ion-icon name="document-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Aprobaciones</ion-label>
            </ion-item>
-->

            <ion-item [routerLink]="['/reloj/reportes']" (click)="closeAdmin()">
                <ion-icon name="documents-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Reportes</ion-label>
            </ion-item>
            <ion-item (click)="presentModalTimbresPerdidos()">
                <ion-icon name="alarm-outline" slot="start" color="dark"></ion-icon>
                <ion-label>Timbres No Enviados</ion-label>
            </ion-item>
            <!--
            <ion-item [routerLink]="['/adminpage/graficas']" lines="none" (click)="closeAdmin()">
                <ion-icon name="bar-chart-outline" slot="start"></ion-icon>
                <ion-label>Gráficas</ion-label>
            </ion-item>
            -->
        </ion-list>
    </ion-content>
    <ion-footer>
        <ion-item (click)="cerrarSesion()" lines="none">
            <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
            <ion-label>Cerrar Sesión</ion-label>
        </ion-item>
    </ion-footer>
</ion-menu>
