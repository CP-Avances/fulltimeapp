<ion-app>
  <ion-content fullscreen class="confirmacion-content">

    <div class="confirmacion-wrapper">

      <section class="logo-section">
        <div class="logo-contenedor">
          <img class="logo-app" src="../../../assets/images/ISOLOGO.png">
        </div>

        <ion-label mode="md" class="app-title">
          <b>Reloj Virtual</b>
        </ion-label>
      </section>

      <section class="success-card">

        <div class="success-icon">
          <ion-icon name="checkmark-done-outline"></ion-icon>
        </div>

        <h1>Timbre enviado con éxito</h1>

        <p class="usuario-nombre">
          {{ nombre_usuario }} {{ apellido_usuario }}
        </p>

        <img class="success-img" src="../../../assets/images/woman.png">

        <div class="detalle-card">
          <div class="detalle-linea">
            <ion-icon name="calendar-outline"></ion-icon>

            <div>
              <span>Timbre enviado el</span>

              <strong *ngIf="isConnected && serverConnected">
                {{ fecha }} a las {{ hora }}
              </strong>

              <strong *ngIf="!isConnected || !serverConnected">
                {{ fechaTransformada }} a las {{ horaTransformada }}
              </strong>
            </div>
          </div>

          <div class="detalle-linea">
            <ion-icon name="location-outline"></ion-icon>

            <div>
              <span>Ubicación</span>

              <strong *ngIf="ubicacion != null && ubicacion != undefined">
                {{ ubicacion }}
              </strong>

              <strong *ngIf="ubicacion == null || ubicacion == undefined">
                Sin ubicación
              </strong>
            </div>
          </div>
        </div>

        <ion-button expand="block" shape="round" class="btn-inicio" (click)="irABienvenido()">

          <ion-icon name="home-outline" slot="start"></ion-icon>
          Ir a inicio

        </ion-button>

      </section>

    </div>

  </ion-content>
</ion-app>
