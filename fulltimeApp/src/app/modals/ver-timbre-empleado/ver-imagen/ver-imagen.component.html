<ion-header>
  <ion-toolbar>
    <ion-title>Ver Imagen</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="cerrarModal()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-imagen-content">
  <div class="image-container">
    <img
      *ngIf="imagen"
      [src]="imagen"
      class="imagen-timbre"
      alt="Imagen del timbre">
  </div>
</ion-content>
