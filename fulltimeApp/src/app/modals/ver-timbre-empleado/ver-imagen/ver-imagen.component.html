<ion-header>
  <ion-toolbar>
    <ion-title>Ver Imagen</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarModal()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content >
  <div class="image-container">
    <ion-img [src]="imagen" *ngIf="imagen" class="full-width"></ion-img>
  </div>
</ion-content>
